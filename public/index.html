<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purificatta — Acesso</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* ── TEMA ── */
:root {
  --az:#1F497D; --azc:#2E75B6; --azf:#DCE6F1; --ci:#F4F7FB; --cb:#C9D9ED;
  --tx:#1a2e45; --tl:#5a7a9a; --vd:#1a7a4a; --vm:#c0392b; --or:#e67e22;
  --bg:#eef3f9; --card:#ffffff; --border:#d8e4f0; --input-bg:#ffffff;
  --input-border:#C9D9ED; --shadow:rgba(31,73,125,.08);
  --topbar-bg:#1F497D; --topbar-text:#ffffff;
  --table-head:#DCE6F1; --row-hover:#f8fbff;
}
[data-theme="dark"] {
  --az:#4a9fd4; --azc:#5aaee0; --azf:#1a2e45; --ci:#1e2d3d; --cb:#2a3f55;
  --tx:#d4e6f5; --tl:#7aabcc; --vd:#3dbb77; --vm:#e05c4a; --or:#e8943a;
  --bg:#111c27; --card:#18283a; --border:#2a3f55; --input-bg:#1e2d3d;
  --input-border:#2a3f55; --shadow:rgba(0,0,0,.35);
  --topbar-bg:#0d1a27; --topbar-text:#d4e6f5;
  --table-head:#1a2e45; --row-hover:#1e2d3d;
}

/* dark overrides */
[data-theme="dark"] body { background:var(--bg); color:var(--tx); }
[data-theme="dark"] .card, [data-theme="dark"] .login-card,
[data-theme="dark"] .modal, [data-theme="dark"] .ob,
[data-theme="dark"] .cb2 { background:var(--card); color:var(--tx); }
[data-theme="dark"] input, [data-theme="dark"] select,
[data-theme="dark"] textarea {
  background:var(--input-bg) !important;
  border-color:var(--input-border) !important;
  color:var(--tx) !important;
}
[data-theme="dark"] .field input, [data-theme="dark"] .field select,
[data-theme="dark"] .field textarea {
  background:var(--input-bg); border-color:var(--input-border); color:var(--tx);
}
[data-theme="dark"] .topbar, [data-theme="dark"] .hd,
[data-theme="dark"] .login-header { background:var(--topbar-bg); }
[data-theme="dark"] .nav { background:var(--card); border-color:var(--border); }
[data-theme="dark"] .nav-tab { color:var(--tl); }
[data-theme="dark"] .nav-tab.active { color:var(--az); border-bottom-color:var(--az); }
[data-theme="dark"] .table-wrap, [data-theme="dark"] .tw { background:var(--card); }
[data-theme="dark"] thead th { background:var(--table-head); color:var(--az); border-color:var(--border); }
[data-theme="dark"] tbody tr { border-color:var(--border); }
[data-theme="dark"] tbody tr:hover { background:var(--row-hover); }
[data-theme="dark"] tbody td { color:var(--tx); }
[data-theme="dark"] .stat-card { background:var(--card); }
[data-theme="dark"] .stat-card span { color:var(--az); }
[data-theme="dark"] .filters select, [data-theme="dark"] .filters input { background:var(--input-bg); border-color:var(--border); color:var(--tx); }
[data-theme="dark"] .link-box { background:var(--ci); border-color:var(--border); color:var(--tx); }
[data-theme="dark"] .card-footer { background:var(--ci); border-color:var(--border); }
[data-theme="dark"] .card-top { border-color:var(--border); }
[data-theme="dark"] .fbar, [data-theme="dark"] .tb2 { background:#1a3050; }
[data-theme="dark"] .ci { color:var(--tx); }
[data-theme="dark"] .ci:focus, [data-theme="dark"] .cd:focus, [data-theme="dark"] .ti:focus { background:var(--input-bg) !important; border-color:var(--az) !important; }
[data-theme="dark"] .cc { background:var(--ci); color:var(--az); }
[data-theme="dark"] .tc { background:#1a3828; color:var(--vd); }
[data-theme="dark"] .ft { background:#0d1a27; }
[data-theme="dark"] .empty { color:var(--tl); }
[data-theme="dark"] #totalRodape { background:#0d1a27; }
[data-theme="dark"] .badge-green { background:#1a3828; color:var(--vd); }
[data-theme="dark"] .badge-red { background:#2d1515; color:var(--vm); }
.theme-toggle {
  background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25);
  color:#fff; border-radius:20px; padding:5px 12px;
  font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500;
  cursor:pointer; display:inline-flex; align-items:center; gap:5px;
  transition:background .15s;
}
.theme-toggle:hover { background:rgba(255,255,255,.25); }

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,var(--topbar-bg) 0%,var(--azc) 50%,#4a9fd4 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:20px;box-shadow:0 20px 60px var(--shadow);width:100%;max-width:420px;overflow:hidden}
.card-top{padding:36px 36px 28px;text-align:center;border-bottom:1px solid var(--border)}
.card-top h1{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--az);margin-bottom:4px}
.card-top p{font-size:13px;color:var(--tl)}
.card-body{padding:32px 36px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--tx);text-transform:uppercase;letter-spacing:.5px}
.field input{border:1.5px solid var(--input-border);border-radius:10px;padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--tx);background:var(--input-bg);outline:none;transition:all .15s}
.field input:focus{border-color:var(--azc);box-shadow:0 0 0 3px rgba(46,117,182,.1)}
.btn-login{background:var(--az);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;width:100%}
.btn-login:hover{background:var(--azc);transform:translateY(-1px);box-shadow:0 4px 16px rgba(31,73,125,.3)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.err{color:var(--vm);font-size:13px;text-align:center;min-height:18px}
.card-footer{padding:16px 36px;background:var(--ci);border-top:1px solid var(--border);text-align:center;font-size:11px;color:var(--tl)}
</style>
<script>
// ── TEMA ──────────────────────────────────
(function(){
  var saved = localStorage.getItem('puri_theme');
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
})();
function toggleTheme(){
  var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('puri_theme', t);
  document.querySelectorAll('.theme-toggle').forEach(function(b){
    b.innerHTML = t === 'dark' ? '&#9728;&#65039; Claro' : '&#127769; Escuro';
  });
}
function initThemeBtn(){
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.querySelectorAll('.theme-toggle').forEach(function(b){
    b.innerHTML = isDark ? '&#9728;&#65039; Claro' : '&#127769; Escuro';
  });
  if(!localStorage.getItem('puri_theme')){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(e){
      if(!localStorage.getItem('puri_theme')) toggleTheme();
    });
  }
}
// ──────────────────────────────────────────
</script>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" style="position:fixed;top:16px;right:16px;z-index:99">🌙 Escuro</button>
<div class="card">
  <div class="card-top">
    <h1>Purificatta</h1>
    <p>Sistema de Controle de Chamados</p>
  </div>
  <div class="card-body">
    <div class="field">
      <label>E-mail / Login</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <p class="err" id="err"></p>
    <button class="btn-login" id="btnLogin" onclick="doLogin()">Entrar</button>
  </div>
  <div class="card-footer">Purificatta Ind. Com. e Serviços de Purificação de Água Ltda.</div>
</div>
<script>
initThemeBtn();
var token = localStorage.getItem('puri_token');
var role = localStorage.getItem('puri_role');
if(token && role){
  window.location.href = role==='admin' ? '/admin' : '/prestador';
}
async function doLogin(){
  var email=document.getElementById('email').value.trim();
  var senha=document.getElementById('senha').value;
  var btn=document.getElementById('btnLogin');
  var err=document.getElementById('err');
  err.textContent='';
  if(!email||!senha){err.textContent='Preencha e-mail e senha';return;}
  btn.disabled=true;btn.textContent='Entrando...';
  try{
    var r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:senha})});
    var d=await r.json();
    if(d.error){err.textContent=d.error;btn.disabled=false;btn.textContent='Entrar';return;}
    localStorage.setItem('puri_token',d.token);
    localStorage.setItem('puri_role',d.role);
    localStorage.setItem('puri_nome',d.nome);
    if(d.prestadorId) localStorage.setItem('puri_prestador_id',d.prestadorId);
    window.location.href = d.role==='admin' ? '/admin' : '/prestador';
  }catch(e){
    err.textContent='Erro de conexão. Tente novamente.';
    btn.disabled=false;btn.textContent='Entrar';
  }
}
</script>
</body>
</html>
